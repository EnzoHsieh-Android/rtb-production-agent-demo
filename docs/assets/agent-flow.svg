<text x="385" y="736" dominant-baseline="middle" fill="#89d0ac" font-size="15">模擬廣告平台</text>
<text x="585" y="736" dominant-baseline="middle" fill="#f4f4f5" font-size="15">分析時只讀平台；要不要加由九條規則決定，AI 只寫說明、猜告警原因；F6、F7 是 README 故障情境的編號</text>
