<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc" font-family="Hiragino Sans GB, sans-serif">
<title id="title">RTB Agent 從 AI 調查到安全寫入</title>
<desc id="desc">分析端資料太舊會重蒐集，缺資料或配速不慢會不提案；配速偏慢時，未開 AI 才交程式規則。AI 可選唯讀查詢或下結論，AI 失敗時改由程式規則判斷。程式計算提案，收件與執行端重查後才寫入模擬平台。說明與假說只給人參考；F6 重放與 F7 核可回到佇列重驗。</desc>
<defs><marker id="arrow-query" markerWidth="3" markerHeight="3" refX="8" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0L8 4L0 8Z" fill="#d5a4f0"/></marker></defs>
