<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="760" viewBox="0 0 1800 760" role="img" aria-labelledby="title desc" font-family="Hiragino Sans GB, sans-serif">
<title id="title">RTB Agent 九條規則判斷到安全寫入</title>
<desc id="desc">第一步只讀目前狀態和近一小時成效，先檢查資料是否太舊，再看有沒有暫停或資料異常；只有預算花得偏慢，才繼續讀調整紀錄、過去加預算的結果、每日與近一天七天成效，並再確認一次現況。程式依九條規則決定要不要加，證據不夠就不調整，值得加才算金額。建議被收下後，AI 另外寫一段說明給人看，執行時不看它、也不等它；出現告警時另外請 AI 猜可能原因；兩者都不影響決定。收下的建議排隊，寫入前再檢查一次才寫進模擬廣告平台；試很多次都沒能開始寫入就先停下等人（故障情境 F6），人工重送、或超過上限時的人工核可（F7）後都重新排隊再檢查。</desc>
<defs><marker id="arrow-read" markerWidth="3" markerHeight="3" refX="8" refY="4" orient="auto" viewBox="0 0 8 8"><path d="M0 0L8 4L0 8Z" fill="#89d0ac"/></marker></defs>
