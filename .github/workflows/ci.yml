# 推送後的機械閘:即使本機用 git push --no-verify 繞過推送前檢查,這裡仍會跑。
name: ci

on:
  push:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 安裝開發期工具
        run: python -m pip install -r requirements-dev.txt
      - name: 程式碼規則(ruff)
        run: python -m ruff check .
      - name: 型別檢查(mypy,嚴格模式)
        run: python -m mypy
      # 浮出框的瀏覽器測試(tests/demo/test_flow_popover_browser.py)用 Python 版 Playwright;CI 一定要跑
      # (使用者 2026-09-25 裁定),瀏覽器要先裝好,沒裝那支會在 CI 紅
      - name: 安裝測試用瀏覽器(Playwright chromium)
        run: python -m playwright install --with-deps chromium
      - name: 測試(pytest)
        run: python -m pytest -q
  # 宣稱驗證器(Phase 11):跟 checks 平行,不拉長 checks 那個工作的時間(F7 的 60 秒上限在那裡)。
  # 本機同一條指令;接線合約見 tests/tools/test_verify_claims.py 的 [S813]。
  claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 安裝開發期工具
        run: python -m pip install -r requirements-dev.txt
      - name: 宣稱驗證器
        run: python tools/verify_claims.py claims/
  # 筆記漂移檢查(lumos drift check):跟 checks 平行。改寫自 lumos doctor 印的範例,拿掉 if:、||、if/then/fi
  # 這些 tests/test_static_wiring.py 不准的寫法:本檔只在 push 觸發,不用 if:;前一版空的時候改在 env 用 GitHub 運算式補零;
  # origin/HEAD 改成單獨一條 git remote set-head(fetch-depth: 0 會抓下所有遠端分支,origin/<預設分支> 一定在)。
  # 回傳碼照原樣:0 沒有要處理(或 warn 只印),1 擋下,其他非零是工具或參數出錯,也紅。lumos 最低要 Python 3.14。
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: 補上遠端預設分支(讓 lumos 找得到主線)
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: git remote set-head origin "$DEFAULT_BRANCH"
      - name: drift check
        env:
          BEFORE: ${{ github.event.before || '0000000000000000000000000000000000000000' }}
          SHA: ${{ github.sha }}
        run: python3 scripts/lumos drift check --diff "$BEFORE..$SHA" --push-remote origin --pushed-ref "$GITHUB_REF" --repo .
