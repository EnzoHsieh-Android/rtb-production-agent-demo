[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]
extend-exclude = ["scripts"]  # lumos 工具的複本,不是本專案的程式

[tool.ruff.lint]
# 風格、未使用、匯入排序、複雜度、函式長度(敘述數)、匯入規則(TID),以及安全與常見錯誤規則。
# 禁用匯入的清單不在這裡:各層在自己目錄的 ruff.toml 宣告(目前只有 src/rtb/domain)。
select = [
    "E", "F", "I", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "TID",
    "S",    # 安全(bandit 的規則):不安全的呼叫、寫死的密碼、吞掉例外等
    "B",    # 常見錯誤(bugbear)
    "UP",   # 過時寫法
    "SIM",  # 可簡化的寫法
    "RUF", "C4", "PIE", "RET", "ARG",
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# 最上層共用模組(sqlitekit、httpkit、httpclient、capabilitykit)吃的是這一份;各層與展示套件的
# ruff.toml 整張重列自己的禁令表(子目錄設定會蓋掉這張表)。Phase 12 代碼審 r1 s2
"rtb.demo".msg = "展示套件(Phase 12)在最外層、只給本機展示:正式程式不得依賴它([S1002])"

[tool.ruff.lint.per-file-ignores]
# 測試裡本來就會 assert、啟動子行程、開連線到本機、用固定種子的亂數
# TID251:上面那張禁令表是給正式程式的;測試本來就要匯入各層與展示套件(禁令表加上之前測試也不受限)
"tests/**" = ["S101", "S603", "S310", "S311", "ARG002", "TID251"]

# lumos 會把檔案抽到 .lumos/lintbase-*/ 臨時目錄再跑 ruff;明寫第一方套件,匯入排序才不會因目錄不同而判斷不一樣
[tool.ruff.lint.isort]
known-first-party = ["rtb", "tests"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 10
max-args = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.14"
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
strict = true
# docs/assets 的產圖腳本刻意不掃（使用者裁定，見 Systems/README流程動圖產生器）。
files = ["src", "tools"]
