[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
# 風格、未使用、匯入排序、複雜度、函式長度(敘述數)、禁用匯入
select = ["E", "F", "I", "C90", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "TID"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 30
max-branches = 10
max-args = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
