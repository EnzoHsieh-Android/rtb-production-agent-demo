"http.server".msg = "領域層不得碰網路"
"requests".msg = "領域層不得碰網路"
"httpx".msg = "領域層不得碰網路"
"urllib3".msg = "領域層不得碰網路"
"aiohttp".msg = "領域層不得碰網路"
"subprocess".msg = "領域層不得啟動行程"
