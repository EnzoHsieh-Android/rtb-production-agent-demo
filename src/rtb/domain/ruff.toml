# 領域層(src/rtb/domain)是純判斷:不得匯入資料庫、網路、行程、動態匯入或模型客戶端。
# 這份設定只在這個目錄生效;DSP、測試與之後的其他層本來就要用這些,不受影響。
extend = "../../../pyproject.toml"

